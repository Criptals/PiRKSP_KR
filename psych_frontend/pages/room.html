<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Видеосессия — Психолог Онлайн</title>
  <link rel="stylesheet" href="/css/base.css">
  <style>
    * { box-sizing: border-box; }
    body { background: #080909; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* header */
    .room-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; height: 56px; flex-shrink: 0;
      background: rgba(14,15,17,.9); border-bottom: 1px solid var(--border);
    }
    .room-brand { font-family: var(--font-serif); font-size: 18px; font-style: italic; }
    .room-brand span { color: var(--accent); }
    .room-status { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); }
    .status-dot.live { background: var(--danger); animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    /* видео-сетка */
    .video-area {
      flex: 1; display: grid; gap: 4px; padding: 8px;
      grid-template-columns: 1fr;
      background: #0a0b0c;
      min-height: 0;
    }
    .video-area.two-up { grid-template-columns: 1fr 1fr; }

    .video-tile {
      position: relative; border-radius: 12px; overflow: hidden;
      background: #111316; display: flex; align-items: center; justify-content: center;
    }
    .video-tile video {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .tile-label {
      position: absolute; bottom: 12px; left: 14px;
      background: rgba(0,0,0,.55); backdrop-filter: blur(6px);
      color: #fff; font-size: 12px; padding: 4px 10px; border-radius: 20px;
    }
    .tile-avatar {
      width: 80px; height: 80px; border-radius: 50%;
      background: var(--accent-dim); display: flex; align-items: center; justify-content: center;
      font-family: var(--font-serif); font-size: 36px; color: var(--bg);
    }

    /* self-view pip */
    .self-pip {
      position: absolute; bottom: 80px; right: 16px;
      width: 160px; height: 110px; border-radius: 10px; overflow: hidden;
      border: 2px solid var(--border); background: #111316;
      box-shadow: 0 4px 20px rgba(0,0,0,.5);
      z-index: 10; display: none;
    }
    .self-pip video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

    /* controls */
    .controls {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      padding: 14px 24px; flex-shrink: 0;
      background: rgba(14,15,17,.95); border-top: 1px solid var(--border);
    }
    .ctrl-btn {
      width: 52px; height: 52px; border-radius: 50%;
      border: 1px solid var(--border); background: var(--bg-card);
      color: var(--text); font-size: 20px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background var(--transition), border-color var(--transition), transform var(--transition);
    }
    .ctrl-btn:hover { background: var(--bg-hover); border-color: var(--border-hl); transform: scale(1.06); }
    .ctrl-btn.off { background: rgba(201,123,123,.15); border-color: var(--danger); color: var(--danger); }
    .ctrl-btn.end { background: var(--danger); border-color: var(--danger); color: #fff; width: 60px; height: 60px; font-size: 22px; }
    .ctrl-btn.end:hover { background: #b56060; }

    .ctrl-label { font-size: 10px; color: var(--text-dim); text-align: center; margin-top: 4px; }
    .ctrl-group { display: flex; flex-direction: column; align-items: center; }

    /* overlay ожидание */
    .waiting-overlay {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      background: #0a0b0c; z-index: 20;
    }
    .waiting-overlay p { color: var(--text-muted); font-size: 14px; text-align: center; }
    .connecting-dots span {
      display: inline-block; width: 8px; height: 8px; background: var(--accent);
      border-radius: 50%; margin: 0 3px; animation: bounce .8s infinite alternate;
    }
    .connecting-dots span:nth-child(2) { animation-delay: .2s; }
    .connecting-dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce { from{transform:translateY(0)} to{transform:translateY(-8px)} }
  </style>
</head>
<body>
  <script src="/js/api.js"></script>

  <!-- шапка -->
  <div class="room-header">
    <div class="room-brand"><span>психо</span>лог онлайн</div>
    <div class="room-status">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">Подключение…</span>
    </div>
    <div id="timer" style="font-size:13px;color:var(--text-muted);font-family:var(--font-mono)">00:00</div>
  </div>

  <!-- видео -->
  <div class="video-area" id="video-area">
    <div class="video-tile" id="remote-tile">
      <div class="tile-avatar" id="remote-avatar">?</div>
      <div class="tile-label">Собеседник</div>
    </div>
    <div class="waiting-overlay" id="waiting-overlay">
      <div class="connecting-dots"><span></span><span></span><span></span></div>
      <p>Ожидаем подключения собеседника…<br>
         <small style="color:var(--text-dim)">Убедитесь, что разрешили доступ к камере и микрофону</small></p>
    </div>
  </div>

  <!-- мини-окно с собственным видео -->
  <div class="self-pip" id="self-pip">
    <video id="local-video" autoplay muted playsinline></video>
  </div>

  <!-- управление -->
  <div class="controls">
    <div class="ctrl-group">
      <button class="ctrl-btn" id="btn-mic" title="Микрофон">🎙</button>
      <div class="ctrl-label">Микрофон</div>
    </div>
    <div class="ctrl-group">
      <button class="ctrl-btn" id="btn-cam" title="Камера">📹</button>
      <div class="ctrl-label">Камера</div>
    </div>
    <div class="ctrl-group">
      <button class="ctrl-btn end" id="btn-end" title="Завершить звонок">📵</button>
      <div class="ctrl-label">Завершить</div>
    </div>
  </div>

    <script>
    requireAuth();

    // ─── Параметры ───
    const params = new URLSearchParams(location.search);
    const appointmentId = params.get('appointment');
    if (!appointmentId) { location.href = 'dashboard.html'; }

    // Проверьте порт! Если бэкенд на 8000, то WS обычно тоже там.
    const WS_BASE = 'ws://localhost:8000/api/v1/sessions/ws';

    // ─── Состояние ───
    let localStream = null;
    let peerConn = null;
    let socket = null;
    let micOn = true;
    let camOn = true;
    let timerInterval = null;
    let seconds = 0;
    let roomId = null;
    let isInitiator = false; // Роль: true = создает Offer, false = ждет Offer

    // ─── UI Элементы ───
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const timerEl = document.getElementById('timer');
    const waitingOverlay = document.getElementById('waiting-overlay');
    const remoteTile = document.getElementById('remote-tile');
    const remoteAvatar = document.getElementById('remote-avatar');

    function setStatus(state, label) {
      statusDot.className = 'status-dot' + (state === 'live' ? ' live' : '');
      statusText.textContent = label;
    }

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      seconds = 0;
      timerInterval = setInterval(() => {
        seconds++;
        const m = String(Math.floor(seconds / 60)).padStart(2, '0');
        const s = String(seconds % 60).padStart(2, '0');
        timerEl.textContent = `${m}:${s}`;
      }, 1000);
    }

    // ─── Инициализация ───
    async function init() {
      let session;
      try {
        session = await api.getSession(appointmentId);
      } catch(e) {
        alert('Сессия не найдена.');
        history.back(); return;
      }
      roomId = session.room_id;

      // 1. Сначала получаем доступ к камере
      await startMedia();
      // 2. Затем подключаемся к сигнальному серверу
      connectSignaling();
    }

    // ─── Медиа (Камера/Микрофон) ───
    async function startMedia() {
      try {
        // Запрашиваем и видео, и аудио
        localStream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: true
        });

        // Показываем себя в PiP
        const localVideo = document.getElementById('local-video');
        localVideo.srcObject = localStream;
        document.getElementById('self-pip').style.display = 'block';
        localVideo.play().catch(e => console.warn("Local play error:", e));

      } catch(e) {
        console.error('Media Error:', e);
        alert('Нет доступа к камере. Проверьте разрешения браузера.');
      }
    }

    // ─── WebRTC Конфигурация ───
    const ICE_SERVERS = [{ urls: 'stun:stun.l.google.com:19302' }];

    function createPeerConnection() {
      if (peerConn) peerConn.close();

      const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });

      // Добавляем наши треки (видео+аудио) в соединение
      if (localStream) {
        localStream.getTracks().forEach(track => {
          pc.addTrack(track, localStream);
          console.log(`Added local track: ${track.kind}`);
        });
      }

      // Когда приходит удаленный трек (видео или аудио собеседника)
      pc.ontrack = (event) => {
        console.log(`Received remote track: ${event.track.kind}`);

        // Ищем или создаем видео-элемент для собеседника
        let remoteVideo = remoteTile.querySelector('video');
        if (!remoteVideo) {
          remoteVideo = document.createElement('video');
          remoteVideo.autoplay = true;
          remoteVideo.playsInline = true;
          remoteVideo.muted = false; // Важно: звук собеседника должен быть слышен
          remoteVideo.style.cssText = 'width:100%;height:100%;object-fit:cover;';
          remoteTile.appendChild(remoteVideo);

          // Скрываем аватар, когда пошло видео
          if (remoteAvatar) remoteAvatar.style.display = 'none';
          waitingOverlay.style.display = 'none';
        }

        // Привязываем поток
        if (event.streams[0]) {
          remoteVideo.srcObject = event.streams[0];
          remoteVideo.play().catch(e => console.warn("Remote play error:", e));
        }

        setStatus('live', 'В эфире');
        startTimer();
      };

      // Отправка ICE кандидатов через WebSocket
      pc.onicecandidate = (event) => {
        if (event.candidate && socket && socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({
            type: 'candidate',
            candidate: event.candidate
          }));
        }
      };

      pc.onconnectionstatechange = () => {
        console.log('Connection State:', pc.connectionState);
        if (pc.connectionState === 'connected') {
          setStatus('live', 'Подключено');
        } else if (['disconnected', 'failed', 'closed'].includes(pc.connectionState)) {
          setStatus('', 'Соединение разорвано');
        }
      };

      return pc;
    }

    // ─── Сигналинг (WebSocket) ───
    function connectSignaling() {
      socket = new WebSocket(`${WS_BASE}/${roomId}`);

      socket.onopen = () => {
        console.log('WebSocket connected');
        setStatus('', 'Поиск собеседника...');
        // Отправляем сигнал "Я готов".
        // Сервер перешлет это другому участнику.
        // Кто первый получил "ready" от другого — тот становится Инициатором?
        // Нет, проще: кто первый подключился к WS, тот и Initator.
        // Но так как мы не знаем порядок, используем простую логику:
        // Просто ждем сообщений. Если пришел 'offer' — мы Answerer.
        // Если никто не присылает offer через 2 секунды — мы Initiator.

        setTimeout(() => {
          if (!peerConn && socket.readyState === WebSocket.OPEN) {
            console.log('No offer received, becoming Initiator');
            becomeInitiator();
          }
        }, 2000);
      };

      socket.onmessage = async ({ data }) => {
        const msg = JSON.parse(data);
        console.log('Signal received:', msg.type);

        if (msg.type === 'offer') {
          // Мы получили Offer -> мы Ответчик (Answerer)
          await handleOffer(msg.sdp);
        }
        else if (msg.type === 'answer') {
          // Мы получили Answer -> мы Инициатор (Initiator)
          if (peerConn) {
            await peerConn.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: msg.sdp }));
            console.log('Remote Description set (Answer)');
          }
        }
        else if (msg.type === 'candidate') {
          // Получили ICE кандидат
          if (peerConn) {
            try {
              await peerConn.addIceCandidate(new RTCIceCandidate(msg.candidate));
            } catch (e) {
              console.error('Error adding candidate:', e);
            }
          }
        }
      };

      socket.onclose = () => setStatus('', 'Отключено');
      socket.onerror = (err) => console.error('WS Error:', err);
    }

    // Роль: Инициатор (создает Offer)
    async function becomeInitiator() {
      isInitiator = true;
      peerConn = createPeerConnection();
      try {
        const offer = await peerConn.createOffer();
        await peerConn.setLocalDescription(offer);
        socket.send(JSON.stringify({ type: 'offer', sdp: offer.sdp }));
        console.log('Sent Offer');
      } catch (e) {
        console.error('Error creating offer:', e);
      }
    }

    // Роль: Ответчик (принимает Offer, шлет Answer)
    async function handleOffer(sdp) {
      // Если мы уже инициатор (конфликт), то игнорируем или перезапускаем
      // В простой версии: если peerConn уже есть, значит мы уже начали процесс
      if (peerConn && peerConn.signalingState !== 'stable') {
        console.warn('Conflict: Already have a connection process');
        return;
      }

      peerConn = createPeerConnection();
      try {
        await peerConn.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp: sdp }));
        const answer = await peerConn.createAnswer();
        await peerConn.setLocalDescription(answer);
        socket.send(JSON.stringify({ type: 'answer', sdp: answer.sdp }));
        console.log('Sent Answer');
      } catch (e) {
        console.error('Error handling offer:', e);
      }
    }

    // ─── Кнопки управления ───
    document.getElementById('btn-mic').addEventListener('click', () => {
      micOn = !micOn;
      if (localStream) localStream.getAudioTracks().forEach(t => t.enabled = micOn);
      const btn = document.getElementById('btn-mic');
      btn.classList.toggle('off', !micOn);
      btn.textContent = micOn ? '🎙' : '🔇';
    });

    document.getElementById('btn-cam').addEventListener('click', () => {
      camOn = !camOn;
      if (localStream) localStream.getVideoTracks().forEach(t => t.enabled = camOn);
      const btn = document.getElementById('btn-cam');
      btn.classList.toggle('off', !camOn);
      btn.textContent = camOn ? '📹' : '📷';
    });

    document.getElementById('btn-end').addEventListener('click', () => {
      if (confirm('Завершить сессию?')) {
        cleanup();
        history.back();
      }
    });

    function cleanup() {
      clearInterval(timerInterval);
      if (localStream) localStream.getTracks().forEach(t => t.stop());
      if (peerConn) peerConn.close();
      if (socket) socket.close();
    }

    window.addEventListener('beforeunload', cleanup);

    // Запуск
    init();
  </script>
</body>
</html>
