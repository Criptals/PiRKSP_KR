<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Главная — Психолог Онлайн</title>
  <link rel="stylesheet" href="/css/base.css">
  <style>
    .greeting { font-size: clamp(28px, 4vw, 46px); margin-bottom: 6px; }
    .greeting-sub { color: var(--text-muted); font-size: 14px; margin-bottom: 40px; }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-bottom: 40px; }
    .stat-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 20px 24px;
    }
    .stat-label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px; }
    .stat-value { font-family: var(--font-serif); font-size: 36px; font-weight: 300; }
    .upcoming-list { display: flex; flex-direction: column; gap: 10px; }
    .upcoming-item {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 16px 20px;
      transition: border-color var(--transition);
    }
    .upcoming-item:hover { border-color: var(--border-hl); }
    .upcoming-info { display: flex; flex-direction: column; gap: 4px; }
    .upcoming-name { font-family: var(--font-serif); font-size: 18px; }
    .upcoming-time { font-size: 12px; color: var(--text-muted); }
    .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .section-head h2 { font-size: 22px; }
  </style>
</head>
<body>
  <script src="/js/api.js"></script>
  <script src="/js/navbar.js"></script>

  <div class="page-wrap">
    <h1 class="greeting">Здравствуйте, <span id="user-name">…</span></h1>
    <p class="greeting-sub">Ваш личный кабинет</p>

    <!-- статистика -->
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-label">Всего записей</div>
        <div class="stat-value" id="total-count">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Ожидают подтверждения</div>
        <div class="stat-value" id="pending-count">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Предстоящие</div>
        <div class="stat-value" id="confirmed-count">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Завершённые</div>
        <div class="stat-value" id="completed-count">—</div>
      </div>
    </div>

    <!-- ближайшие записи -->
    <div class="section-head">
      <h2>Предстоящие записи</h2>
      <a href="psychologists.html" class="btn btn-sm btn-primary">+ Записаться</a>
    </div>
    <div id="upcoming-list" class="upcoming-list">
      <div class="loading-overlay"><div class="spinner"></div></div>
    </div>
  </div>

  <script>
    requireUser();

    const user = Auth.getUser();
    document.getElementById('user-name').textContent = user.full_name.split(' ')[0];

    async function loadDashboard() {
      const appointments = await api.getAppointments().catch(() => []);

      document.getElementById('total-count').textContent     = appointments.length;
      document.getElementById('pending-count').textContent   = appointments.filter(a => a.status === 'pending').length;
      document.getElementById('confirmed-count').textContent = appointments.filter(a => a.status === 'confirmed').length;
      document.getElementById('completed-count').textContent = appointments.filter(a => a.status === 'completed').length;

      const upcoming = appointments
        .filter(a => a.status === 'confirmed')
        .sort((a, b) => new Date(a.slot.starts_at) - new Date(b.slot.starts_at))
        .slice(0, 5);

      const list = document.getElementById('upcoming-list');

      if (upcoming.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <div class="icon">🗓</div>
            <p>Нет предстоящих сессий.<br>
               <a href="psychologists.html">Найдите психолога</a> и запишитесь на первую консультацию.</p>
          </div>`;
        return;
      }

      list.innerHTML = upcoming.map(a => {
        const canJoin = a.session && a.session.is_active;
        return `
          <div class="upcoming-item">
            <div class="upcoming-info">
              <span class="upcoming-name">Запись #${a.id}</span>
              <span class="upcoming-time">${formatDate(a.slot.starts_at)}</span>
            </div>
            <div class="row" style="gap:8px">
              ${badgeHtml(a.status)}
              ${canJoin
                ? `<a href="room.html?appointment=${a.id}" class="btn btn-sm btn-primary">Войти</a>`
                : '<span class="btn btn-sm" style="pointer-events:none;opacity:.4">Войти</span>'}
            </div>
          </div>`;
      }).join('');
    }

    loadDashboard();
  </script>
</body>
</html>
